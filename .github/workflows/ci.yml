name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 没有 npm install：运行时零依赖。为了让 CI「什么也不证明」而把 Electron 拉进容器，
      # 就是让仓库从此开始怕网络抖动。
      - name: Syntax check every source
        run: npm run check

      # 真正的门禁：判胜入口的选择性——环不止一条 / 打结 / 带尾巴 / 提示差一 / 空盘 / 少一条边
      # 都必须被拒，而 golden 参考环必须被收；再往回删掉某一条款，红必须**只**出现在它身上。
      # 步骤名里不写断言条数：条数是被测对象的性质，写进 CI 就是每次加断言都要改工作流。
      - name: Independent win verifier (selectivity + per-clause mutation)
        run: node tools/verify-test.mjs

      - name: Loop facts vs naive cross-check
        run: node tools/loop-test.mjs

      - name: Exact DP counter vs naive cross-check
        run: node tools/counter-test.mjs

      - name: Pencil solver (推错了必须为 0)
        run: node tools/pencil-test.mjs

      - name: Golden fixtures match the frozen records
        run: node tools/golden-test.mjs

      # 文档数字闸：README/DESIGN 里每一条能由代码重算的数字都用现跑重算一遍。代码是基准，
      # 文档是被告——数字对不上时改的是文档，不是断言。
      - name: Doctest every recomputable number in the docs
        run: node tools/doctest.mjs

      # 破坏试验台账：十三把刀一组一把各破坏一组断言、各自把闸带红、再逐字节还原。一把没红过的刀不算证人。
      - name: Sabotage ledger (every knife must turn the gate red)
        run: node tools/sabotage.mjs

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs
